<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온가족 한상 — 회원가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 팀 시안(레시피·피드백 화면)에서 뽑은 색 */
  :root {
    --bg-top: #EBD3C0;      /* 주방 배경 윗부분의 따뜻한 베이지 */
    --bg-bottom: #F5F3ED;   /* 하단 바 크림색 */
    --desk: #E4D6CB;
    --card: #FFF4F4;        /* 레시피 카드 바탕 */
    --card-line: #EBAAA6;   /* 레시피 카드 테두리(연어색) */
    --white: #FFFFFF;
    --ink: #1C1F1F;
    --muted: #9A7C7C;       /* 카드 안 보조 글씨 */
    --soft: #B89A9A;
    --line: #D4D4D4;        /* 흰 버튼 회색 테두리 */
    --orange: #FFA43C;      /* "이 메뉴로 할래요" 버튼 */
    --orange-strong: #FF9900; /* "남겼어요" 버튼 */
    --orange-soft: #FFE9CF;
    --danger: #D23B3B;
    --fade: rgba(235,211,192,0);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #3A2C24; --bg-bottom: #241E1B; --desk: #1A1513; --card: #3A2D2D; --card-line: #8E5C59;
      --white: #2F2826; --ink: #F5ECE8; --muted: #D2B4B4; --soft: #A98E8E; --line: #5A4D4A;
      --orange-soft: #4A3420; --danger: #FF7A7A; --fade: rgba(58,44,36,0); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #3A2C24; --bg-bottom: #241E1B; --desk: #1A1513; --card: #3A2D2D; --card-line: #8E5C59;
    --white: #2F2826; --ink: #F5ECE8; --muted: #D2B4B4; --soft: #A98E8E; --line: #5A4D4A;
    --orange-soft: #4A3420; --danger: #FF7A7A; --fade: rgba(58,44,36,0); color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100%;
    background: var(--desk); color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.55;
  }
  .app {
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-top) 0, var(--bg-top) 260px, var(--bg-bottom) 900px);
  }
  @media (min-width: 600px) {
    body { padding: 32px 0; }
    .app { border-radius: 36px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(74,46,42,.4); min-height: auto; }
  }

  .topbar { text-align: center; font-size: .9rem; color: var(--ink); opacity: .75; padding: 14px 0 4px; }

  /* ---------- 상단 일러스트 ---------- */
  .hero { position: relative; margin: 16px 16px 0; border-radius: 20px; overflow: hidden; }
  .hero img { display: block; width: 100%; height: auto; }

  .wrap { padding: 18px 16px 40px; }

  h1, h2 { font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: 1.5rem; line-height: 1.3; }
  .lead { margin: 6px 0 14px; color: var(--ink); opacity: .75; font-size: .93rem; }

  /* 시안의 "AI가 생성한 레시피입니다" 카드 모양 */
  .notice {
    background: var(--card); border: 2px solid var(--card-line); border-radius: 16px;
    padding: 12px 14px; margin-bottom: 16px; font-size: .88rem;
    box-shadow: 0 2px 6px rgba(150,90,80,.12);
  }
  .notice strong { display: block; font-size: .95rem; margin-bottom: 2px; }
  .notice span { color: var(--muted); }

  /* ---------- 가입 폼 ---------- */
  .card {
    background: var(--card); border: 2px solid var(--card-line); border-radius: 18px;
    padding: 20px 16px; box-shadow: 0 2px 6px rgba(150,90,80,.12);
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .9rem; font-weight: 700; margin-bottom: 6px; }
  .input {
    position: relative; display: flex; align-items: center;
    border: 1.5px solid var(--line); border-radius: 12px; background: var(--white);
    transition: border-color .15s;
  }
  .input:focus-within { border-color: var(--orange-strong); }
  .input.bad { border-color: var(--danger); }
  .input.ok { border-color: #5BAA6E; }
  .input input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font: inherit; padding: 12px 14px; outline: none;
  }
  .input input::placeholder { color: var(--soft); }
  .eye {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: .85rem;
    padding: 8px 12px; cursor: pointer; border-radius: 10px;
  }
  .eye:focus-visible { outline: 2px solid var(--orange-strong); }
  .msg { font-size: .82rem; margin-top: 5px; min-height: 1.2em; color: var(--muted); }
  .msg.bad { color: var(--danger); }
  .msg.ok { color: #3E8A52; }


  /* 약관 동의 */
  .agree { border: 0; border-top: 1.5px dashed var(--card-line); margin: 6px 0 0; padding: 14px 0 0; }
  .check { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: .9rem; }
  .check input { width: 22px; height: 22px; accent-color: var(--orange-strong); margin: 0; flex: none; }
  .check.all { font-weight: 700; font-size: 1rem; padding-bottom: 10px; }
  .check .req { color: var(--orange-strong); font-weight: 700; }
  .check .opt { color: var(--muted); }
  .check label { flex: 1; cursor: pointer; }
  .view {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: .8rem;
    text-decoration: underline; cursor: pointer; padding: 4px;
  }
  .note { font-size: .78rem; color: var(--muted); margin: 0 0 4px 32px; }

  /* 시안의 "이 메뉴로 할래요" 버튼: 주황 바탕 + 진한 글씨 */
  .submit {
    width: 100%; margin-top: 16px; border: 1.5px solid #E58A1F; border-radius: 16px;
    padding: 15px; font: inherit; font-weight: 700; font-size: 1.05rem;
    background: var(--orange); color: #1C1F1F; cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  .submit:active:not(:disabled) { transform: translateY(2px); }
  .submit:disabled { opacity: .45; cursor: not-allowed; }
  .submit:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .form-error { color: var(--danger); font-size: .86rem; margin-top: 10px; text-align: center; min-height: 1.2em; }
  .login-link { text-align: center; font-size: .88rem; color: var(--muted); margin: 10px 0 0; }
  .login-link a { color: var(--ink); font-weight: 700; }

  /* ---------- 자주 묻는 질문 ---------- */
  .faq { margin-top: 26px; }
  .faq h2 { font-size: 1.15rem; margin-bottom: 2px; }
  .faq .sub { color: var(--muted); font-size: .86rem; margin: 0 0 12px; }
  /* 시안 오른쪽 화면의 흰 카드(가족별 피드백 줄) 모양 */
  .qa { background: var(--white); border: 1.5px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
  .qa.hidden { display: none; }
  .q {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    border: 0; background: none; color: var(--ink); font: inherit; font-size: .93rem; font-weight: 700;
    padding: 14px; cursor: pointer;
  }
  .q:focus-visible { outline: 3px solid var(--orange-strong); outline-offset: -3px; border-radius: 14px; }
  .q .badge {
    flex: none; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center; font-size: .85rem;
    background: var(--orange-soft); color: #B56500;
  }
  .q .txt { flex: 1; }
  .q .chev { flex: none; transition: transform .25s; color: var(--muted); }
  .q[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .q[aria-expanded="true"] .badge { background: var(--orange-strong); color: #1C1F1F; }
  .a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .q[aria-expanded="true"] + .a { grid-template-rows: 1fr; }
  .a > div { overflow: hidden; }
  .a p { margin: 0; padding: 0 14px 14px 50px; color: var(--muted); font-size: .9rem; }
  .a .warn { color: var(--danger); }
  .a .src { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .78rem; color: var(--soft); }
  .a ul { margin: 6px 0 0; padding-left: 18px; }
  .more {
    width: 100%; border: 1.5px solid var(--line); background: var(--white); color: var(--ink);
    border-radius: 16px; padding: 13px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 4px;
  }
  .more:focus-visible { outline: 3px solid var(--orange-strong); outline-offset: 2px; }

  /* ---------- 약관 보기 / 가입 완료 ---------- */
  dialog {
    border: 2px solid var(--card-line); border-radius: 18px; padding: 20px; width: min(360px, 90vw);
    background: var(--card); color: var(--ink);
  }
  dialog::backdrop { background: rgba(40,20,18,.45); }
  dialog h2 { font-size: 1.1rem; margin-bottom: 10px; }
  dialog p { font-size: .88rem; color: var(--muted); margin: 0 0 16px; }
  #termBody { white-space: pre-line; max-height: 55vh; overflow-y: auto; line-height: 1.6; color: var(--ink); padding-right: 4px; }
  dialog button { width: 100%; border: 1.5px solid #E58A1F; border-radius: 14px; padding: 12px; background: var(--orange); color: #1C1F1F; font: inherit; font-weight: 700; cursor: pointer; }

  .done { text-align: center; padding: 40px 10px; }
  .done .big { font-size: 3rem; }
  .done h1 { margin: 8px 0; }
  .done p { color: var(--muted); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

          <div class="check">
            <input type="checkbox" class="term" id="t1" data-required="1">
            <label for="t1"><span class="req">(필수)</span> 이용약관 동의</label>
            <button type="button" class="view" data-term="terms">보기</button>
          </div>
          <div class="check">
            <input type="checkbox" class="term" id="t2" data-required="1">
            <label for="t2"><span class="req">(필수)</span> 개인정보 수집·이용 동의</label>
            <button type="button" class="view" data-term="privacy">보기</button>

          <div class="check">
            <input type="checkbox" class="term" id="t3" data-required="1">
            <label for="t3"><span class="req">(필수)</span> 건강정보(민감정보) 처리 동의</label>
            <button type="button" class="view" data-term="health">보기</button>

          <p class="note">알레르기·당뇨 같은 가족 건강 정보는 법에서 따로 동의를 받도록 정한 민감정보예요.</p>

        <div class="form-error" id="formError" role="alert"></div>
        <p class="login-link">이미 가입했나요? <a href="login.html">로그인</a></p>

      <!-- ================= 자주 묻는 질문 ================= -->
      <section class="faq" aria-labelledby="faqTitle">
        <h2 id="faqTitle">자주 묻는 질문</h2>

        <div id="faqList"></div>
        <button class="more" type="button" id="moreBtn" aria-expanded="false" aria-controls="faqList">질문 더 보기</button>

    <!-- ================= 가입 완료 ================= -->

<dialog id="termDialog" aria-labelledby="termTitle">

<script src="api.js"></script>
<script>
(() => {
  /* ═══════════════ 자주 묻는 질문 데이터 ═══════════════
     처음 VISIBLE_COUNT개(4개)만 보이고 나머지는 "질문 더 보기"로 펼침.
     [팀 확정 필요] 표시가 있는 답변은 정책이 정해지면 문구를 바꾸세요.
     (나중에 관리자 화면에서 고치고 싶다면 Supabase 'faqs' 테이블로 옮기고
      fetch로 불러오면 됩니다 → 아래 loadFaqs 참고) */
  const FAQS = [
    { q: '냉장고 사진이나 영수증 사진이 저장되나요?',
      a: '저장하지 않아요. 사진에서 재료 이름만 읽어 저장하고, 사진은 분석이 끝나면 바로 지워요.' },
    { q: '가족의 알레르기나 당뇨 같은 건강 정보는 안전한가요?',
      a: '건강 정보는 우리 가족에게 맞는 레시피를 고르는 데만 써요. 이웃 밥상에 공유하는 글에도 절대 함께 올라가지 않아요.' },
    /* [팀 확정 필요] 알레르기 동의어 사전을 실제로 식약처 표시 기준 + PubMed 자료로 만들었을 때만 이 문구를 쓰세요.
       source의 날짜는 기준표를 마지막으로 갱신한 날짜로 맞춰야 "최신"이라는 말이 사실이 돼요.
       [서버 연동 지점] 갱신 날짜를 DB(예: allergen_dictionary_meta.updated_at)에서 불러오면 자동으로 맞춰져요. */
    { q: '알레르기 재료가 레시피에 들어가지 않는다고 믿어도 되나요?',
      a: '알레르기 검사는 AI가 짐작하는 방식이 아니라, 정해진 기준표로 재료를 하나하나 확인하는 방식이에요. 기준표는 식품의약품안전처(식약처)의 알레르기 유발물질 표시 기준과 PubMed(미국 국립의학도서관의 의학 논문 데이터베이스)의 최신 연구 자료를 근거로 만들었어요. 등록한 금지 재료는 물론, 그 재료가 들어간 다른 이름(예: 달걀 → 난백, 마요네즈)까지 찾아서 레시피에서 빼고, 남아 있으면 빨간색으로 표시해 알려드려요.',
      warn: '가공식품과 양념은 제조사마다 성분이 달라 앱이 모두 알 수 없어요. 요리 전에 포장지의 알레르기 표시란을 한 번 더 확인해 주세요.',
      source: '근거: 식약처 알레르기 유발물질 표시 기준, PubMed 연구 자료 · 기준표 업데이트 2026년 10월' },
    /* 4인분 정량 근거 4가지: 당뇨병 식품교환표, 식약처 식품영양성분DB,
       식약처 1회 섭취참고량, 식약처 조리식품 레시피 DB */
    { q: '레시피 양은 어떤 기준으로 정했나요?',
      a: '모든 레시피는 가족 식탁에 맞춘 4인분 기준이에요. 정량은 아래 4가지 공신력 있는 자료를 근거로 잡았고, 같은 레시피를 누가 만들어도 같은 양이 나오도록 표준화했어요.',
      list: [
        '식약처 1회 섭취참고량(영양표시): 1인분 양을 정하는 기준이에요.',
        '식약처 조리식품 레시피 DB: 요리별 재료 구성과 인분 기준을 참고해요.',
        '식약처 식품영양성분DB(국가표준식품성분표 계열): 재료 양을 g과 영양성분으로 환산해요.',
        '당뇨병 식품교환표: 당 관리가 필요한 가족의 변형 레시피 양을 맞춰요.',
        '계량은 1큰술 15ml, 1작은술 5ml, 1컵 200ml로 통일했어요.',
        '재료는 g과 개수를 함께 적어요. 예: 애호박 1/2개(약 150g)',
        '"약간", "적당히"는 꼭 필요한 소금·후추에만 쓰고, 나머지는 숫자로 적어요.',
        '가족이 4명보다 적거나 많으면 재료를 인원 비율대로 늘리거나 줄이면 돼요.',
      ],
      source: '근거: 당뇨병 식품교환표, 식약처 식품영양성분DB, 식약처 1회 섭취참고량, 식약처 조리식품 레시피 DB' },
    { q: '가족이 각자 가입해야 하나요?',   // [팀 확정 필요]
      a: '아니요. 한 명이 가입해서 가족 구성원을 등록하면 돼요. 구성원마다 알레르기와 식단 조건을 따로 넣을 수 있어요.' },
    { q: '가족마다 먹는 게 다른데, 요리를 여러 번 해야 하나요?',
      a: '공통 베이스 요리를 한 번 만들고, 알레르기가 있거나 유동식을 먹는 가족에게는 덜어서 바꾸는 방법을 알려드려요. 한 번에 조리할 수 있게 순서도 정리해 드려요.' },
    { q: '사진 없이도 쓸 수 있나요?',
      a: '네. 냉장고 사진, 영수증 사진, 직접 입력 중 편한 방법을 고르면 돼요.' },
    { q: '내가 만든 요리를 다른 사람이 보게 되나요?',   // [팀 확정 필요] 기본값 비공개
      a: '공유를 체크한 요리만 이웃 밥상에 올라가요. 체크하지 않으면 우리 가족 기록에만 남아요.' },
    { q: '무료인가요? 탈퇴하면 정보는 어떻게 되나요?',   // [팀 확정 필요] 요금 정책
      a: '지금은 모든 기능을 무료로 쓸 수 있어요. 탈퇴하면 가족 구성원과 건강 정보가 모두 바로 삭제돼요.' },
  ];
  const VISIBLE_COUNT = 4;

  const faqList = document.getElementById('faqList');
  const moreBtn = document.getElementById('moreBtn');

  function renderFaqs(list) {
    faqList.innerHTML = '';
    list.forEach((item, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'qa' + (i >= VISIBLE_COUNT ? ' hidden' : '');
      const id = 'faq-a-' + i;
      wrap.innerHTML = `
        <button type="button" class="q" aria-expanded="false" aria-controls="${id}">
          <span class="badge" aria-hidden="true">Q</span>
          <span class="txt"></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="a" id="${id}" role="region"><div><p></p></div></div>`;
      wrap.querySelector('.txt').textContent = item.q;   // textContent: 서버 데이터여도 안전
      const p = wrap.querySelector('p');
      p.textContent = item.a;
      if (item.list) {
        const ul = document.createElement('ul');
        item.list.forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
        p.appendChild(ul);
      }
      if (item.warn) {
        const w = document.createElement('span');
        w.className = 'warn';
        w.textContent = ' ' + item.warn;
        p.appendChild(w);
      }
      if (item.source) {
        const s = document.createElement('span');
        s.className = 'src';
        s.textContent = item.source;
        p.appendChild(s);
      }
      faqList.appendChild(wrap);
    });
    moreBtn.hidden = list.length <= VISIBLE_COUNT;
  }

  // 질문 펼치기/접기 (한 번에 하나만 열림)
  faqList.addEventListener('click', e => {
    const q = e.target.closest('.q');
    if (!q) return;
    const open = q.getAttribute('aria-expanded') === 'true';
    faqList.querySelectorAll('.q').forEach(b => b.setAttribute('aria-expanded', 'false'));
    q.setAttribute('aria-expanded', String(!open));
  });

  moreBtn.addEventListener('click', () => {
    const expanded = moreBtn.getAttribute('aria-expanded') === 'true';
    faqList.querySelectorAll('.qa').forEach((el, i) => {
      if (i >= VISIBLE_COUNT) el.classList.toggle('hidden', expanded);
    });
    moreBtn.setAttribute('aria-expanded', String(!expanded));
    moreBtn.textContent = expanded ? '질문 더 보기' : '질문 접기';
    if (!expanded) faqList.querySelectorAll('.qa')[VISIBLE_COUNT]?.querySelector('.q').focus();
  });

  /* [서버 연동 지점 ①] FAQ를 DB에서 불러오기 (선택)
     const { data } = await supabase.from('faqs').select('q, a, list, warn').order('sort_order');
     if (data?.length) renderFaqs(data);  // 실패하면 위 기본 FAQS 그대로 사용 */
  renderFaqs(FAQS);

  /* ═══════════════ 입력 검증 ═══════════════ */
  const $ = id => document.getElementById(id);
  const fields = {
    name: { el: $('name'), box: $('nameBox'), msg: $('nameMsg'), touched: false },
    email: { el: $('email'), box: $('emailBox'), msg: $('emailMsg'), touched: false },
    pw: { el: $('pw'), box: $('pwBox'), msg: $('pwMsg'), touched: false },
    pw2: { el: $('pw2'), box: $('pw2Box'), msg: $('pw2Msg'), touched: false },
  };
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  const rules = {
    name: v => {
      v = v.trim();
      if (!v) return '이름이나 닉네임을 입력해 주세요.';
      if (v.length < 2) return '2자 이상 입력해 주세요.';
      if (/[<>{}\\]/.test(v)) return '<, >, {, }, \\ 기호는 쓸 수 없어요.';
      return '';
    },
    email: v => {
      v = v.trim();
      if (!v) return '이메일을 입력해 주세요.';
      if (!EMAIL_RE.test(v)) return '이메일 형식을 확인해 주세요. 예: you@example.com';
      return '';
    },
    pw: v => {
      if (!v) return '비밀번호를 입력해 주세요.';
      if (v.length < 8) return '8자 이상 입력해 주세요.';
      if (!/[A-Za-z]/.test(v) || !/\d/.test(v)) return '영문과 숫자를 모두 넣어 주세요.';
      if (/\s/.test(v)) return '공백은 쓸 수 없어요.';
      return '';
    },
    pw2: v => {
      if (!v) return '비밀번호를 한 번 더 입력해 주세요.';
      if (v !== fields.pw.el.value) return '비밀번호가 서로 달라요.';
      return '';
    },
  };
  const okText = { name: '', email: '', pw: '', pw2: '비밀번호가 일치해요.' };

  function strength(v) {
    let s = 0;
    if (v.length >= 8) s++;
    if (/[A-Za-z]/.test(v) && /\d/.test(v)) s++;
    if (v.length >= 12 || /[^A-Za-z0-9]/.test(v)) s++;
    return v ? Math.max(1, s) : 0;
  }

  function validate(key, show) {
    const f = fields[key];
    const err = rules[key](f.el.value);
    if (show) {
      f.box.classList.toggle('bad', !!err);
      f.box.classList.toggle('ok', !err);
      f.msg.className = 'msg ' + (err ? 'bad' : 'ok');
      f.msg.textContent = err || okText[key];
      f.el.setAttribute('aria-invalid', String(!!err));
    }
    return !err;
  }

  Object.entries(fields).forEach(([key, f]) => {
    f.el.addEventListener('input', () => {
      if (key === 'pw') {
        const lv = strength(f.el.value);
        if (!f.touched) $('pwMsg').textContent = lv ? ['', '조금 더 길고 복잡하게 만들어 주세요.', '쓸 만한 비밀번호예요.', '안전한 비밀번호예요.'][lv] : '';
        if (fields.pw2.touched) validate('pw2', true);
      }
      if (key === 'email') $('formError').textContent = '';
      if (f.touched) validate(key, true);
      updateSubmit();
    });
    // 입력 중에는 빨간 경고를 띄우지 않고, 칸을 벗어날 때 처음 검사
    f.el.addEventListener('blur', () => {
      if (f.el.value) { f.touched = true; validate(key, true); }
    });
  });

  // 비밀번호 보기/숨기기
  document.querySelectorAll('.eye').forEach(btn => btn.addEventListener('click', () => {
    const input = $(btn.dataset.target);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? '숨기기' : '보기';
    btn.setAttribute('aria-pressed', String(show));
  }));

  /* ═══════════════ 약관 동의 ═══════════════ */
  const agreeAll = $('agreeAll');
  const terms = [...document.querySelectorAll('.term')];
  agreeAll.addEventListener('change', () => { terms.forEach(t => t.checked = agreeAll.checked); updateSubmit(); });
  terms.forEach(t => t.addEventListener('change', () => {
    agreeAll.checked = terms.every(x => x.checked);
    updateSubmit();
  }));

  const TERM_TEXT = {
    // [초안] 이용약관 전문 — 실제 서비스 전에 법률 검토를 받아 주세요
    terms: ['이용약관', [
      '[초안] 실제 서비스 전에 법률 검토가 필요해요.',
      '',
      '제1조 (목적)',
      '이 약관은 온가족 한상(이하 \'서비스\')을 이용할 때 회사와 회원 사이의 권리, 의무, 책임과 그 밖에 필요한 사항을 정해요.',
      '',
      '제2조 (서비스 내용)',
      '1. 냉장고 사진·영수증 사진·직접 입력으로 식재료를 등록하는 기능',
      '2. 등록한 재료로 가족이 함께 먹을 수 있는 레시피를 추천하고, 가족 구성원별로 덜어 만드는 방법(분기점)을 안내하는 기능',
      '3. 레시피 보관함, 식사 후 평가·감사 남기기, 다른 가정과 요리 사진·레시피를 공유하는 기능',
      '',
      '제3조 (회원 가입과 계정)',

      '3. 광고·스팸, 욕설·혐오 표현, 음란물 등 부적절한 내용을 올리는 행위',
      '4. 서비스 운영을 방해하거나 다른 사람의 계정을 도용하는 행위',

      '제9조 (탈퇴와 정보 삭제)',
      '회원은 언제든 탈퇴할 수 있어요. 탈퇴하면 계정, 가족 구성원 정보, 건강 정보가 바로 삭제돼요. 다만 법령에서 보관하도록 정한 정보는 정해진 기간 동안만 보관해요.',
      '',
      '제10조 (책임의 한계)',
      '회사는 회원이 입력한 정보가 틀렸거나, 성분표 확인 없이 조리해 생긴 문제에 대해서는 책임을 지지 않아요. 다만 회사의 고의나 중대한 과실로 생긴 손해는 예외예요.',
      '',
      '제11조 (약관 변경)',
      '약관을 바꿀 때는 시행 7일 전(회원에게 불리한 변경은 30일 전)부터 서비스 안에서 알려 드려요.',
      '',
      '부칙: 이 약관은 2026년 10월 19일부터 시행해요.'
    ].join('\n'), 't1'],
    privacy: ['개인정보 수집·이용', '수집 항목: 이름(닉네임), 이메일 / 목적: 회원 식별, 서비스 제공 / 보유 기간: 탈퇴 시까지', 't2'],
    health: ['건강정보(민감정보) 처리', '수집 항목: 가족 구성원의 알레르기, 당뇨·다이어트 등 식단 조건 / 목적: 맞춤 레시피 제안 / 보유 기간: 탈퇴 또는 구성원 삭제 시까지. 동의하지 않으면 맞춤 레시피 기능을 쓸 수 없어요.', 't3'],
  };
  const dlg = $('termDialog');
  let currentTerm = null;
  document.querySelectorAll('.view').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.term === 'all') {                 // 전체 동의: 약관을 모두 이어서 보여줘요
      $('termTitle').textContent = '전체 약관';
      $('termBody').textContent = ['terms', 'privacy', 'health'].map(k => '■ ' + TERM_TEXT[k][0] + '\n' + TERM_TEXT[k][1]).join('\n\n')
        + '\n\n■ 새 레시피·이벤트 소식 받기 (선택)\n새 레시피와 이벤트 소식을 이메일로 보내 드려요. 동의하지 않아도 서비스를 이용할 수 있고, 언제든 수신을 끊을 수 있어요.'
        + '\n\n■ 만 14세 이상 (필수)\n만 14세 미만은 보호자 동의 절차가 필요해서 지금은 가입할 수 없어요.';
      $('termAgree').textContent = '모두 동의하고 닫기';
      currentTerm = 'all';
    } else {
      const [title, body, id] = TERM_TEXT[b.dataset.term];
      $('termTitle').textContent = title;
      $('termBody').textContent = body;
      $('termAgree').textContent = '동의하고 닫기';
      currentTerm = id;
    }
    $('termBody').scrollTop = 0;
    dlg.showModal();
  }));
  $('termAgree').addEventListener('click', () => {
    if (currentTerm === 'all') terms.forEach(t => t.checked = true);
    else if (currentTerm) $(currentTerm).checked = true;
    agreeAll.checked = terms.every(x => x.checked);
    updateSubmit();
    dlg.close();
  });

  /* ═══════════════ 가입하기 ═══════════════ */
  const submitBtn = $('submit');
  function requiredAgreed() { return terms.filter(t => t.dataset.required).every(t => t.checked); }
  function allValid() { return Object.keys(fields).every(k => validate(k, false)); }
  function updateSubmit() { submitBtn.disabled = !(allValid() && requiredAgreed()); }

  /* [서버 연동 지점 ②] 회원가입 요청
     실제 프로젝트(Supabase Auth)에서는 아래 데모 코드를 이렇게 바꾸세요:

     const { data, error } = await supabase.auth.signUp({
       email, password,
       options: {
         data: { name, marketing: t4 },                 // user_metadata에 저장
         emailRedirectTo: `${location.origin}/family/setup`, // 메일 인증 후 가족 등록 화면으로
       },
     });
     if (error) throw error;   // 이미 가입된 이메일이면 error.message에 안내가 옴

     [서버 연동 지점 ③] 동의 기록 저장 (민감정보 동의는 언제 동의했는지 남겨야 함)
     await supabase.from('consents').insert({
       user_id: data.user.id, terms: true, privacy: true, health: true,
       marketing: t4, agreed_at: new Date().toISOString(),
     });
     → consents 테이블에는 RLS로 "본인 행만 읽기/쓰기" 정책을 꼭 걸어 주세요.

     ⚠ 비밀번호는 절대 직접 테이블에 저장하지 마세요. Supabase Auth가 암호화해서 관리해요. */
  // 서버에 회원가입 요청 (비밀번호는 서버에서 해시로만 저장해요)
  async function signUp({ name, email, password, marketing }) {
    try {
      const res = await HansangAPI.request('POST', '/api/auth/signup', { json: {
        name, email, password,
        consents: { terms: $('t1').checked, privacy: $('t2').checked, health: $('t3').checked, marketing, age14: $('t5').checked }
      } });
      HansangAPI.setSession(res);
      try { localStorage.setItem('consents', JSON.stringify({ health: $('t3').checked, at: Date.now() })); } catch {}
      return res;
    } catch (err) {
      const e = new Error(err.message || 'failed');
      e.code = err.status === 409 ? 'duplicate' : (err.status === 0 ? 'offline' : 'server');
      e.detail = err.message;
      throw e;
    }
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    Object.keys(fields).forEach(k => { fields[k].touched = true; validate(k, true); });
    const firstBad = Object.keys(fields).find(k => !validate(k, false));
    if (firstBad) { fields[firstBad].el.focus(); return; }
    if (!requiredAgreed()) { $('formError').textContent = '필수 약관에 모두 동의해 주세요.'; return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '가입하는 중…';
    $('formError').textContent = '';
    try {
      await signUp({
        name: fields.name.el.value.trim(),
        email: fields.email.el.value.trim(),
        password: fields.pw.el.value,
        marketing: $('t4').checked,
      });
      $('doneTitle').textContent = `${fields.name.el.value.trim()}님, 환영해요!`;
      $('signupView').hidden = true;
      $('doneView').hidden = false;
      window.scrollTo({ top: 0 });
      $('doneTitle').setAttribute('tabindex', '-1');
      $('doneTitle').focus();
    } catch (err) {
      if (err.code === 'duplicate') {
        fields.email.box.classList.add('bad');
        fields.email.msg.className = 'msg bad';
        fields.email.msg.textContent = '이미 가입된 이메일이에요. 로그인하거나 다른 이메일을 써 주세요.';
        fields.email.el.focus();
      } else if (err.code === 'offline') {
        $('formError').textContent = '서버에 연결하지 못했어요. 잠시 후 다시 눌러 주세요. (처음 접속은 1분쯤 걸릴 수 있어요)';
      } else {
        $('formError').textContent = err.detail || '가입하지 못했어요. 잠시 후 다시 눌러 주세요.';
      }
      submitBtn.textContent = '가입하기';
      updateSubmit();
    }
  });

  $('resetBtn').addEventListener('click', () => { location.href = 'family-profile.html'; });
})();
</script>
</body>
