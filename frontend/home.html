  }
  @media (max-width: 420px) { .phone { width: 100%; height: 100%; } }
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(255,242,230,.4) 0%, rgba(255,242,230,.25) 40%, rgba(244,242,236,.6) 78%, rgba(244,242,236,.9) 100%);
  }

  /* 상단 */
  .head {
    position: relative; z-index: 1; margin-top: 20px; height: 62px; padding: 14px 12px 0 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { margin: 0; font-size: 18px; font-weight: 800; color: var(--ink-deep); letter-spacing: -.01em; }

  .scroll {
    position: relative; z-index: 1; flex: 1; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; padding: 6px 18px 16px; scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; }

  h1 {
    margin: 4px 0 8px; font-size: 27px; line-height: 1.3; font-weight: 800; color: var(--ink-deep); letter-spacing: -.02em; word-break: keep-all;
    text-shadow: 0 0 12px rgba(255,244,232,.95), 0 0 2px rgba(255,244,232,.9);
  }
  .sub { margin: 0 0 16px; font-size: 13.5px; line-height: 1.5; font-weight: 700; color: #3b2a24; text-shadow: 0 0 8px rgba(255,244,232,.95); max-width: 320px; }

  /* 냉장고 / 영수증 사진 칸 */
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slot {
    position: relative; overflow: hidden; min-height: 172px; padding: 14px 8px 8px; border-radius: 28px; text-align: center;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .slot.fridge { background: var(--accent); box-shadow: 0 10px 24px rgba(160, 90, 20, .24); }
  .slot.receipt { background: #fffdf8; box-shadow: 0 10px 24px rgba(90, 58, 34, .16); outline: 2px dashed #e0cdb2; outline-offset: -8px; }
  .slot-main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    border: 0; background: none; cursor: pointer; color: var(--accent-ink);
    font-size: 16.5px; line-height: 1.3; font-weight: 800; letter-spacing: -.01em; word-break: keep-all;
  }
  .slot-main svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .slot-sub { padding: 8px 6px; border: 0; background: none; cursor: pointer; color: #5a3a22; font-size: 12px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .slot-x {
    position: absolute; top: 8px; right: 8px; z-index: 2; width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: rgba(40, 26, 20, .62); color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .slot-x[hidden] { display: none; }
  .slot.filled { background: #e8e0d0 var(--img) center / cover no-repeat; outline: none; }
  .slot.filled::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(40,26,20,.1), rgba(40,26,20,.62)); }
  .slot.filled > :not(.slot-x) { position: relative; }
  .slot.filled .slot-main, .slot.filled .slot-sub { color: #fff; }
  .slot.filled .slot-main svg { display: none; }
  .slot.filled .slot-main { justify-content: flex-end; padding-bottom: 2px; }

  .find {
    width: 100%; height: 54px; margin-top: 12px; border-radius: 28px; border: 2px solid var(--line);
    background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 800; cursor: pointer;
    box-shadow: 0 8px 20px rgba(160, 90, 20, .2); transition: transform .15s, opacity .15s;
  }
  .find[hidden] { display: none; }
  .find[aria-disabled="true"] { opacity: .6; cursor: wait; }

  .manual {
    width: 100%; height: 54px; margin-top: 12px; border-radius: 28px; border: 2px solid var(--line);
    background: #fbfaf6; color: #1f1a17; font-size: 16px; font-weight: 800; cursor: pointer;
    transition: transform .15s, background .15s;
  }
  .manual:hover { background: #fff; }
  .manual:active, .find:active, .slot-main:active { transform: scale(.985); }

  .slot-main:focus-visible, .slot-sub:focus-visible, .slot-x:focus-visible, .find:focus-visible, .manual:focus-visible,
  .tab:focus-visible, .btn:focus-visible, .sug:focus-visible, .ing button:focus-visible,
  .add-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* 하단 */
  .foot { position: relative; z-index: 1; background: var(--paper); }
  .foot::before { content: ""; position: absolute; left: 0; right: 0; top: -26px; height: 26px; background: linear-gradient(to bottom, rgba(244,242,236,0), var(--paper)); pointer-events: none; }
  .note { margin: 0; padding: 8px 22px 2px; font-size: 11.5px; line-height: 1.45; font-weight: 500; color: #3b2a24; }
  .tabs { display: flex; justify-content: space-around; padding: 6px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .tab { flex: 1; height: 46px; display: grid; place-items: center; background: none; border: 0; cursor: pointer; color: var(--tab-off); }
  .tab svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-current="page"] { color: var(--tab-on); }
  .tab[aria-current="page"] svg { stroke-width: 2.3; }

  /* 시트 */
  .sheet { position: absolute; inset: 0; z-index: 10; visibility: hidden; display: flex; align-items: flex-end; }
  .sheet.open { visibility: visible; }
  .backdrop { position: absolute; inset: 0; background: rgba(40, 26, 20, .45); opacity: 0; transition: opacity .2s; }
  .sheet.open .backdrop { opacity: 1; }
  .panel {
    position: relative; width: 100%; max-height: 90%; overflow-y: auto; background: var(--paper); border-radius: 28px 28px 0 0;
    padding: 12px 20px calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform .22s ease;
  }
  .sheet.open .panel { transform: translateY(0); }
  .grip { width: 40px; height: 4px; border-radius: 2px; background: #d6cfc2; margin: 0 auto 12px; }
  .panel h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; color: var(--ink); text-align: center; }
  .panel .desc { margin: 0 0 14px; font-size: 12.5px; line-height: 1.5; font-weight: 500; color: var(--muted); text-align: center; }
  .btn {
    width: 100%; height: 52px; border-radius: 28px; border: 2px solid var(--line); background: #fff; color: #1f1a17;
    font-size: 15.5px; font-weight: 800; cursor: pointer; transition: transform .15s, opacity .15s;
  }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--accent); }
  .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }

  /* 재료 직접 입력 */
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; min-width: 0; height: 48px; padding: 0 14px; border: 1.5px solid #d9cfc2; border-radius: 14px; background: #fff;
    font-size: 15px; font-weight: 700; color: var(--ink-deep); outline: none;
  }
  .add-row input:focus-visible { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(74,47,39,.18); }
  .add-row input::placeholder { color: #a39a90; font-weight: 500; }
  .add-btn { flex: none; width: 64px; height: 48px; border: 2px solid var(--line); border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 800; cursor: pointer; }
  .group-label { margin: 16px 2px 8px; font-size: 12.5px; font-weight: 800; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .sug { height: 36px; padding: 0 14px; border: 1.5px solid #d9cfc2; border-radius: 999px; background: #fff; color: var(--ink-deep); font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .sug[aria-pressed="true"] { background: var(--olive-bg); border-color: #b8c79a; color: #3c4d26; }
  .ing { display: inline-flex; align-items: center; gap: 2px; height: 38px; padding: 0 4px 0 14px; border: 1.5px solid #6f7f45; border-radius: 999px; background: #fff; color: #3c4d26; font-size: 14px; font-weight: 800; }
  .ing button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; color: #3c4d26; font-size: 18px; line-height: 1; cursor: pointer; }
  .none { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
  .f-msg { margin: 8px 2px 0; font-size: 12.5px; font-weight: 800; color: var(--danger); }
  .f-msg[hidden] { display: none; }

  .toast {
    position: absolute; z-index: 20; left: 50%; bottom: 120px; transform: translate(-50%, 12px);
    background: #3b2a24; color: #fff; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 20px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="phone">
  <div class="scrim"></div>

  <header class="head">
    <p class="brand">온가족 한상</p>
  </header>

  <div class="scroll" id="scroll">
    <h1 id="greet">오늘 저녁,<br>냉장고부터 열어볼까요?</h1>
    <p class="sub">사진 한 장이면 한 가지 요리로 가족 모두의 상을 차릴 수 있어요.</p>

    <div class="slots">
      <div class="slot fridge" id="slotFridge">
        <button class="slot-x" type="button" id="xFridge" aria-label="냉장고 사진 지우기" hidden>&times;</button>
        <button class="slot-main" type="button" id="camFridge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/></svg>
          <span id="lblFridge">냉장고 사진 찍기</span>
        </button>
        <button class="slot-sub" type="button" id="galFridge">또는 갤러리에서 고르기</button>
      </div>
      <div class="slot receipt" id="slotReceipt">
        <button class="slot-x" type="button" id="xReceipt" aria-label="영수증 사진 지우기" hidden>&times;</button>
        <button class="slot-main" type="button" id="camReceipt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-2-1.500-1.500 1.500L12 19.500 10.500 21 9 19.500 7 21z"/><path d="M10 8h4M10 12h4"/></svg>
          <span id="lblReceipt">영수증 사진 찍기</span>
        </button>
        <button class="slot-sub" type="button" id="galReceipt">또는 갤러리에서 고르기</button>
      </div>
    </div>

    <button class="find" type="button" id="find" hidden>사진으로 재료 찾기</button>

    <button class="manual" type="button" id="manual">재료를 직접 입력할래요</button>

  </div>

  <footer class="foot">
    <p class="note">AI가 생성한 레시피예요. 알레르기가 있다면 식품 성분표를 꼭 확인하세요.</p>
    <nav class="tabs" aria-label="하단 메뉴">
      <button class="tab" type="button" aria-label="홈" aria-current="page" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3.5 11 12 3.5 20.5 11V20.500h-5.500v-6h-6v6H3.500z"/></svg>
      </button>
      <button class="tab" type="button" aria-label="레시피" data-tab="recipes">
        <svg viewBox="0 0 24 24"><path d="M12 6.500C9.800 5 6.800 4.500 3.500 4.500v13.500c3.300 0 6.300.5 8.500 2 2.200-1.500 5.200-2 8.500-2V4.500c-3.300 0-6.300.5-8.500 2zM12 6.500v13.500"/></svg>
      </button>
      <button class="tab" type="button" aria-label="냉장고 사진 찍기" data-tab="camera">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/></svg>
      </button>
      <button class="tab" type="button" aria-label="내 정보" data-tab="me">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.500 21c0-4.200 3.300-6.800 7.500-6.800s7.500 2.600 7.500 6.800"/></svg>
      </button>
    </nav>
  </footer>

  <!-- 재료 직접 입력 시트 -->
  <div class="sheet" id="shManual" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="backdrop" data-close></div>
    <div class="panel">
      <div class="grip"></div>
      <h3 id="mTitle">냉장고 재료를 입력해요</h3>
      <p class="desc">쉼표(,)로 나누면 여러 재료를 한 번에 넣을 수 있어요. (최대 20개)</p>
      <div class="add-row">
        <input id="mInput" type="text" maxlength="80" autocomplete="off" enterkeyhint="done" placeholder="예: 두부, 애호박 (쉼표로 여러 개)" aria-label="재료 이름 (쉼표로 여러 개 입력)">
        <button class="add-btn" type="button" id="mAdd">추가</button>
      </div>
      <p class="f-msg" id="mMsg" hidden></p>
      <p class="group-label">자주 쓰는 재료</p>
      <div class="chips" id="mSug"></div>
      <p class="group-label">내 재료 <span id="mCount">0</span>개</p>
      <div class="chips" id="mList"></div>
      <div class="actions">
        <button class="btn" type="button" data-close>취소</button>
        <button class="btn primary" type="button" id="mGo" aria-disabled="true">레시피 찾기</button>
      </div>
    </div>
  </div>

  <input type="file" id="inCamera" accept="image/*" capture="environment" hidden>
  <input type="file" id="inFile" accept="image/*" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script>
  /* =====================================================
   * 1) 설정
   * ===================================================== */
  // 화면 이동: 파일들을 한 폴더에 두고 Live Server 등으로 열 때 true 로 바꾸세요.
  // false 이면 이동 대신 안내 메시지만 보여줘요.
  var ENABLE_NAV = true;
  var ROUTES = {
    ingredientCheck: 'ingredient-check.html',   // 재료 확인 화면
    todayMeal: 'today-meal.html',               // 오늘의 한상(레시피 추천)
    recipes: 'saved-recipes.html',              // 저장한 요리
    me: 'family-profile.html'                   // 내 정보 (아직 전용 화면이 없어서 가족 프로필로 연결)
  };
  var ROUTE_NAME = { ingredientCheck: '재료 확인', todayMeal: '오늘의 한상', recipes: '저장한 요리', me: '내 정보' };


  /* =====================================================
   * 2) 공통 유틸
   * ===================================================== */
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;       // textContent만 사용
    return n;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var toastEl = $('toast'), toastTimer;
  function show(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  function go(route) {
    if (ENABLE_NAV && ROUTES[route]) { location.href = ROUTES[route]; return; }
    show((ROUTE_NAME[route] || '다음') + ' 화면으로 이동해요');
  }

  /* ---------- 시트 열기/닫기 ---------- */
  var openId = null, openerEl = null;
  function openSheet(id, from, focusId) {
    closeSheet(true);
    openId = id; openerEl = from || null;
    $(id).classList.add('open');
    if (focusId) $(focusId).focus();
  }
  function closeSheet(silent) {
    if (!openId) return;
    $(openId).classList.remove('open');
    openId = null;
    if (!silent && openerEl && document.body.contains(openerEl)) openerEl.focus();
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) { b.addEventListener('click', function () { closeSheet(); }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* =====================================================
   * 3) 인사말
   * ===================================================== */
  (function greet() {
    var h = new Date().getHours();
    var when = h < 11 ? '아침' : (h < 16 ? '점심' : '저녁');
    $('greet').innerHTML = '';
    $('greet').appendChild(document.createTextNode('오늘 ' + when + ','));
    $('greet').appendChild(document.createElement('br'));
    $('greet').appendChild(document.createTextNode('냉장고부터 열어볼까요?'));
  })();


  /* =====================================================
   * 4) 냉장고 / 영수증 사진 (촬영 · 갤러리)
   *    두 칸에 각각 사진을 넣고, 한 번에 "재료 찾기"를 눌러요. (한 장만 넣어도 돼요)
   * ===================================================== */
  var MAX_MB = 10;
  var KIND = {
    fridge:  { name: '냉장고', slot: 'slotFridge',  lbl: 'lblFridge',  x: 'xFridge' },
    receipt: { name: '영수증', slot: 'slotReceipt', lbl: 'lblReceipt', x: 'xReceipt' }
  };
  var inCamera = $('inCamera'), inFile = $('inFile');
  var photos = { fridge: null, receipt: null }, urls = { fridge: null, receipt: null };
  var target = null, finding = false;

  function pick(kind, mode) {
    if (finding) return;
    target = kind;
    (mode === 'camera' ? inCamera : inFile).click();       // 모바일: 카메라 앱 / PC: 파일 선택창
  }
  $('camFridge').addEventListener('click', function () { pick('fridge', 'camera'); });
  $('galFridge').addEventListener('click', function () { pick('fridge', 'file'); });
  $('camReceipt').addEventListener('click', function () { pick('receipt', 'camera'); });
  $('galReceipt').addEventListener('click', function () { pick('receipt', 'file'); });
  document.querySelector('[data-tab="camera"]').addEventListener('click', function () { pick('fridge', 'camera'); });

  // 다시 그려서 JPEG로 저장: 위치(GPS) 같은 숨은 정보를 없애고 용량도 줄여요
  function processImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('encode')); }, 'image/jpeg', 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

  async function onPicked(e) {
    var input = e.target, file = input.files && input.files[0], kind = target;
    input.value = '';
    if (!file || !kind) return;
    if (!file.type || file.type.indexOf('image/') !== 0) { show('이미지 파일만 올릴 수 있어요'); return; }
    if (file.size > MAX_MB * 1024 * 1024) { show(MAX_MB + 'MB 이하 사진만 올릴 수 있어요'); return; }
    try {
      var blob = await processImage(file);
      if (urls[kind]) URL.revokeObjectURL(urls[kind]);
      photos[kind] = blob; urls[kind] = URL.createObjectURL(blob);
      renderSlots();
      show(KIND[kind].name + ' 사진을 불러왔어요');
    } catch (err) {
      show('이 사진은 불러올 수 없어요. 다른 사진을 골라 주세요');
    }
  }
  inCamera.addEventListener('change', onPicked);
  inFile.addEventListener('change', onPicked);

  function clearPhoto(kind) {
    if (finding) return;
    if (urls[kind]) URL.revokeObjectURL(urls[kind]);
    photos[kind] = null; urls[kind] = null;
    renderSlots();
  }
  $('xFridge').addEventListener('click', function () { clearPhoto('fridge'); });
  $('xReceipt').addEventListener('click', function () { clearPhoto('receipt'); });

  function renderSlots() {
    var n = 0;
    Object.keys(KIND).forEach(function (k) {
      var has = !!photos[k], slot = $(KIND[k].slot);
      if (has) n++;
      slot.classList.toggle('filled', has);
      if (has) slot.style.setProperty('--img', 'url("' + urls[k] + '")'); else slot.style.removeProperty('--img');
      $(KIND[k].lbl).textContent = has ? KIND[k].name + ' 사진 완료 \u2713' : KIND[k].name + ' 사진 찍기';
      $(KIND[k].x).hidden = !has;
    });
    $('galFridge').textContent = photos.fridge ? '다른 사진 고르기' : '또는 갤러리에서 고르기';
    $('galReceipt').textContent = photos.receipt ? '다른 사진 고르기' : '또는 갤러리에서 고르기';
    $('find').hidden = !n;
    $('find').textContent = n === 2 ? '사진 2장으로 재료 찾기' : '사진으로 재료 찾기';
    $('find').setAttribute('aria-disabled', 'false');
  }

  $('find').addEventListener('click', async function () {
    if (finding) return;
    if (!photos.fridge && !photos.receipt) { show('사진을 한 장 이상 넣어 주세요'); return; }
    finding = true;
    $('find').textContent = '재료를 찾는 중…'; $('find').setAttribute('aria-disabled', 'true');
    try {
      /* ---- 실제 API 연동 예시 ----
      var fd = new FormData();
      if (photos.fridge)  fd.append('fridge',  photos.fridge,  'fridge.jpg');
      if (photos.receipt) fd.append('receipt', photos.receipt, 'receipt.jpg');
      var res = await fetch('https://YOUR-BACKEND/api/ingredients/analyze', { method: 'POST', body: fd });
      if (!res.ok) throw new Error('analyze failed: ' + res.status);
      var found = await res.json();          // 예: { ingredients: ['두부', '애호박', ...] }
      sessionStorage.setItem('foundIngredients', JSON.stringify(found.ingredients));
      ---------------------------- */
      await sleep(900);                      // 가짜 대기 시간
      window.pendingPhotos = { fridge: photos.fridge, receipt: photos.receipt };   // 확인용
      // 사진 인식 연동 전 예시 결과 (사진 원본은 넘기지 않고 재료 이름만 넘겨요)
      var draft = { source: 'photo', items: [], dropped: [] };
      if (photos.fridge) { draft.items.push('두부', '애호박', '달걀', '대파', '당근'); draft.suspect = ['새우']; draft.dropped.push('케첩'); }
      if (photos.receipt) { draft.items.push('양파', '소고기', '시금치'); draft.dropped.push('햄', '간장'); }
      try { localStorage.setItem('ingredientDraft', JSON.stringify(draft)); } catch (e) { /* 건너뜀 */ }
      go('ingredientCheck');
    } catch (e) {
      show('재료를 찾지 못했어요. 잠시 후 다시 시도해 주세요');
    } finally { finding = false; renderSlots(); }
  });

  /* =====================================================
   * 5) 재료 직접 입력
   * ===================================================== */
  var MAX_ING = 20;
  var SUGGEST = ['두부', '애호박', '달걀', '대파', '당근', '양파', '감자', '우유', '닭가슴살', '김치'];
  var mine = [];

  function mMsg(t) { var m = $('mMsg'); m.hidden = !t; m.textContent = t || ''; }
  // 쉼표(,)로 나누면 각각 다른 재료로 추가해요. 예: "두부, 애호박" → 두부 / 애호박
  function addIng(raw) {
    var parts = String(raw).split(/[,，、]/).map(function (x) { return x.trim().replace(/\s+/g, ' '); }).filter(Boolean);
    if (!parts.length) { mMsg('재료 이름을 입력해 주세요'); return false; }
    var added = 0, dup = [], tooLong = [], full = false;
    parts.forEach(function (t) {
      if (t.length > 12) { tooLong.push(t); return; }
      if (mine.some(function (x) { return x.replace(/\s/g, '') === t.replace(/\s/g, ''); })) { dup.push(t); return; }
      if (mine.length >= MAX_ING) { full = true; return; }
      mine.push(t); added++;
    });
    var msgs = [];
    if (dup.length) msgs.push('이미 추가한 재료예요: ' + dup.join(', '));
    if (tooLong.length) msgs.push('재료 이름은 12자까지 쓸 수 있어요: ' + tooLong.join(', '));
    if (full) msgs.push('재료는 최대 ' + MAX_ING + '개까지 넣을 수 있어요');
    mMsg(msgs.join(' / '));
    renderManual();
    return added > 0;
  }
  function removeIng(t) { mine = mine.filter(function (x) { return x !== t; }); renderManual(); }

  function renderManual() {
    var sug = $('mSug'); sug.innerHTML = '';
    SUGGEST.forEach(function (s) {
      var on = mine.indexOf(s) !== -1;
      var b = el('button', 'sug', s); b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.addEventListener('click', function () { if (on) removeIng(s); else addIng(s); });
      sug.appendChild(b);
    });
    var list = $('mList'); list.innerHTML = '';
    if (!mine.length) list.appendChild(el('p', 'none', '아직 추가한 재료가 없어요'));
    mine.forEach(function (t) {
      var c = el('span', 'ing', t);
      var x = el('button', null, '\u00d7'); x.type = 'button'; x.setAttribute('aria-label', t + ' 삭제');
      x.addEventListener('click', function () { removeIng(t); });
      c.appendChild(x); list.appendChild(c);
    });
    $('mCount').textContent = mine.length;
    $('mGo').setAttribute('aria-disabled', mine.length ? 'false' : 'true');
  }

  $('manual').addEventListener('click', function () { mMsg(''); renderManual(); openSheet('shManual', $('manual'), 'mInput'); });
  $('mAdd').addEventListener('click', function () { if (addIng($('mInput').value)) { $('mInput').value = ''; } $('mInput').focus(); });
  $('mInput').addEventListener('keydown', function (e) {
    if (e.isComposing) return;                      // 한글 입력 중 Enter 중복 방지
    if (e.key === 'Enter') { e.preventDefault(); if (addIng(e.target.value)) e.target.value = ''; }
  });
  $('mInput').addEventListener('input', function () { mMsg(''); });
  $('mGo').addEventListener('click', function () {
    if (!mine.length) { mMsg('재료를 하나 이상 추가해 주세요'); $('mInput').focus(); return; }
    /* 실제 서비스에서는 이 재료 목록을 서버로 보내 레시피를 추천받아요 (사진 분석 대신 이 목록을 사용)
       POST /api/recipes/recommend  { ingredients: mine } */
    try { localStorage.setItem('fridgeIngredients', JSON.stringify(mine)); } catch (e) { /* 건너뜀 */ }
    window.fridgeIngredients = mine.slice();
    try { localStorage.setItem('ingredientDraft', JSON.stringify({ source: 'manual', items: mine.slice(), dropped: [] })); } catch (e) { /* 건너뜀 */ }
    closeSheet(true);
    go('ingredientCheck');
  });

  /* =====================================================
   * 6) 하단 탭 / 시작
   * ===================================================== */
  document.querySelector('[data-tab="recipes"]').addEventListener('click', function () { go('recipes'); });
  document.querySelector('[data-tab="me"]').addEventListener('click', function () { go('me'); });
  document.querySelector('[data-tab="home"]').addEventListener('click', function () { $('scroll').scrollTo({ top: 0, behavior: 'smooth' }); });

  renderSlots();
</script>
<script src="nav.js"></script>
</body>
</html>
