# Render Blueprint: 온가족 한상 (화면 + 백엔드 + DB)
# Render 대시보드 → New → Blueprint 로 이 저장소를 고르면 아래 설정대로 만들어져요.
services:
  # 화면 (정적 사이트)
  - type: web
    name: M3-1-Final-Team-Project
    runtime: static
    buildCommand: ""
    staticPublishPath: ./frontend
    pullRequestPreviewsEnabled: false

  # 백엔드 (FastAPI)
  - type: web
    name: onfamily-hansang-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: onfamily-hansang-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY      # 대시보드에서 직접 넣어요 (비워 두면 예시 레시피·예시 재료 인식)
        sync: false
      - key: OPENAI_BASE_URL     # 코디세이: https://copa.codyssey.kr/v1 (OpenAI 그대로 쓰면 비워 두기)
        sync: false
      - key: OPENAI_MODEL        # 코디세이에서 빠르고 안정적인 모델
        value: gpt-5.4-mini
      - key: OPENAI_VISION       # 코디세이 키는 사진 입력을 지원하지 않아서 꺼 둬요
        value: "false"
      - key: MFDS_API_KEY        # 공공데이터포털 식품영양성분DB 키 (비워 두면 기본 수치로 검사)
        sync: false

databases:
  - name: onfamily-hansang-db
    region: singapore
    plan: free
    databaseName: hansang
    user: hansang
