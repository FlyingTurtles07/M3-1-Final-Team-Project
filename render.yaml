# Render Blueprint — 백엔드(FastAPI) 배포 설정 (담당: feature/backend-infra)
# 사용: Render 대시보드 → New → Blueprint → 이 저장소 선택. 값이 비어 있는 키는 화면에서 직접 입력해요(여기에 쓰지 않아요).
services:
  - type: web
    name: onfamily-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/api/requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HEALTH_DATA_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: POLICY_VERSION
        value: "2026-10-19"
