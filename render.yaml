# Render Blueprint: 온가족 한상 (화면 + 백엔드 + DB)
# Render 대시보드 → New → Blueprint 로 이 저장소를 고르면 아래 설정대로 만들어져요.
services:
  # 화면 (정적 사이트)
  - type: web
    name: M3-1-Final-Team-Project
    runtime: static
    buildCommand: ""
    staticPublishPath: ./frontend
    pullRequestPreviewsEnabled: false

  # 백엔드 (FastAPI)
  - type: web
    name: onfamily-hansang-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FIREBASE_CREDENTIALS   # Firebase 서비스 계정 키 JSON 내용 (대시보드에서 직접 넣어요). 데이터는 Firestore에 저장해요
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY      # 대시보드에서 직접 넣어요 (비워 두면 예시 레시피·예시 재료 인식)
        sync: false
      - key: OPENAI_BASE_URL     # 코디세이: https://copa.codyssey.kr/v1 (OpenAI 그대로 쓰면 비워 두기)
        sync: false
      - key: OPENAI_MODEL        # 레시피 추천 모델 (토큰 사용량이 적은 모델)
        value: gemini-3-flash
      - key: OPENAI_VISION       # 코디세이 키는 사진 입력을 지원하지 않아서 꺼 둬요
        value: "false"
      - key: VISION_API_KEY      # 사진 재료 인식 전용 키 (Google AI Studio Gemini 키). 대시보드에서 직접 넣어요
        sync: false
      - key: VISION_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_VISION_MODEL
        value: gemini-3.1-flash-lite
      - key: VISION_FALLBACK_MODELS
        value: gemini-3-flash-preview
      - key: IMAGE_MODEL         # AI 레시피 요리 사진 (코디세이 그림 API)
        value: gpt-image-2
      - key: IMAGE_MAX_PER_HOUR  # 한 시간에 새로 그리는 최대 장수 (비용 안전장치)
        value: "40"
      - key: MFDS_API_KEY        # 공공데이터포털 식품영양성분DB 키 (비워 두면 기본 수치로 검사)
        sync: false

databases:
  - name: onfamily-hansang-db
    region: singapore
    plan: free
    databaseName: hansang
    user: hansang
